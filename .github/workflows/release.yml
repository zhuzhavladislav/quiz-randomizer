name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # Только собираем; публикует отдельное задание ниже, чтобы две ОС не создавали релиз наперегонки
      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # без подписи: на площадке приложение запускается через «Открыть» в контекстном меню
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers

      - run: ls -la installers

      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: installers/*
          fail_on_unmatched_files: true
          body: |
            QuizRandomizer ${{ github.ref_name }}

            - `*-win-x64.exe` - Windows installer
            - `*-mac-arm64.dmg` - macOS on Apple Silicon (M1 and newer)
            - `*-mac-x64.dmg` - macOS on Intel

            Builds are not code-signed: on macOS right-click the app and choose "Open" the first time;
            on Windows click "More info" → "Run anyway" in SmartScreen.
