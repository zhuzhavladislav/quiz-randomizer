appId: kz.zhuzha.quiznabis.randomizer
productName: QuizNaBis Randomizer
copyright: © Vladislav Zhuzha
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - resources/**/*
  - package.json
asar: true
artifactName: quiznabis-randomizer-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: zhuzhavladislav
  repo: quiznabis-randomizer
  releaseType: release
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  identity: null
dmg:
  title: QuizNaBis Randomizer
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Рандомайзер КВИЗ на БИС
  language: 1049
