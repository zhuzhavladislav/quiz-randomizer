appId: kz.zhuzha.quizrandomizer
productName: QuizRandomizer
copyright: © Vladislav Zhuzha, MIT License
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - presets/*.rpreset
  - package.json
asar: true
artifactName: quiz-randomizer-${version}-${os}-${arch}.${ext}
publish:
  provider: github
  owner: zhuzhavladislav
  repo: quiz-randomizer
  releaseType: release
mac:
  category: public.app-category.entertainment
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  darkModeSupport: true
  identity: null
dmg:
  title: QuizRandomizer
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: QuizRandomizer
  installerLanguages: [en_US, ru_RU]
